[package]
name = "product-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.0", features = ["db-postgres"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls","uuid","macros","chrono","rust_decimal"] }
uuid =  version = "1", features = ["serde", "v4"] }
dotenvy = "0.15"   # 環境変数管理
tower-http={version="0.6.2", features=["cors"]}
chrono = { version = "0.4.42", features = ["serde"] }

