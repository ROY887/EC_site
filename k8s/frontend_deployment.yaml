apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontned
  namespace: ec-frontend
  labels: 
    app.kubernetes.io/name: frontend 
    app.kubernetes.io/part-of: ec-microservices
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend 
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: ec-microservices
        app.kubernetes.io/version: "1.0.0" 
      annotations: 
        prometheus.io/path: "/metrics"
        prometheus.io/scrape: "true"
        prometheus.io/port: "5173"
    
    spec:
      terminationGracePeriod:  30
      restartPolicy: Always
      containers:
      - name: frontend
        image: ec_site-frontend:latest
        ports:
        - containerPort: 5173
          protocol: TCP  
          name: http 
        env: 
        - name: VITE_PRODUCT_API_URL 
          value: "https://api.ec_site.example.com/api/product"
        - name: VITE_CART_API_URL
          value: "https://api.ec_site.example.com/api/cart"
        - name: VITE_USER_API_URL
          value: "https://api.ec_site.example.com/api/cart"
        - name: VITE_DEBUG
          value: "false"
        - name: NODE_ENV
          value: production

        resources:
          requests: 
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi" 
        livenessProbe: 
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe: 
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
          
        securityContext: 
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000

          readOnlyFilesystem: true 
          capabilities:
            drop:
            - ALL

      volumes:
      - name: tmp 
        emptyDir: {}
      - name: config 
        configMap:
          name: config_map
        volumeMounts: 
        - name: tmp
          mountPath: /tmp 
        - name: config 
          mountPath: /etc/config
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo 'starting' > /tmp/message"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]

---
apiVersion: v1
kind: Service
metadata: 
  namespace: ec-frontend
  name: frontend-service
  labels: 
    app.kubernetes.io/name: frontend-service
    app.kubernetes.io/part-of: ec-microservices 
    app.kubernetes.io/version: "1.0.0"
spec: 
  type: ClusterIP
  selector: 
    app.kubernetes.io/name: frontend

  annotations: ec-microservices 

          



        
          






        
      
