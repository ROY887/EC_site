apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: product-api-route
  namespace: ec-system
  labels:
    app.kubernetes.io/name: product-api
    app.kubernetes.io/part-of: ec-microservices
spec:
  parentRefs:
  - name: ec-apigate-way
    namespace: ec-system
    sectionName: http

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/products
      method: GET
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /products
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-Service
          value: product-api
    backendRefs:
    - name: product-service
      namespace: ec-backend
      port: 8084
    timeouts:
      request: 15s
