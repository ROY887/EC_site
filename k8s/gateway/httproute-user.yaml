# 認証は user-api / cart-api のミドルウェアが JWT を検証して行う。
# Gateway 側のヘッダ付与は、どのサービスに向いたリクエストかを
# ログで追跡するための目印であり、認可の判断には使っていない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-api-route
  namespace: ec-system
  labels:
    app.kubernetes.io/name: user-api
    app.kubernetes.io/part-of: ec-microservices
spec:
  parentRefs:
  - name: ec-apigate-way
    namespace: ec-system
    sectionName: http

  rules:
  # ログイン（Exact マッチのため ReplaceFullPath を使う）
  - matches:
    - path:
        type: Exact
        value: /api/login
      method: POST
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /login
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-Service
          value: user-api
    backendRefs:
    - name: user-service
      namespace: ec-backend
      port: 8081
    timeouts:
      request: 15s

  # ユーザー登録・取得・更新・削除
  - matches:
    - path:
        type: PathPrefix
        value: /api/users
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /users
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-Service
          value: user-api
    backendRefs:
    - name: user-service
      namespace: ec-backend
      port: 8081
    timeouts:
      request: 15s
