apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-api-route
  namespace: ec-system
  labels:
    app.kubernetes.io/name: user-api
    app.kubernetes.io/part-of: ec-microservices
spec:
  parentRefs:
  - name: ec-gateway
    namespace: ec-system
    sectionName: https
  
  hostnames:
  - "api.ec-site.example.com"

  rules:
# ユーザー登録
  - matches:
    - path:
        type: Exact
        value: /api/users
      method: POST
    backendRefs:
    - name: user-api-service
      port: 8081
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-Service
          value: user-api
    timeouts:
      request: 15s
  
  # ログイン
  - matches:
    - path:
        type: Exact
        value: /api/login
      method: POST
    backendRefs:
    - name: user-api-service
      port: 8081
    timeouts:
      request: 10s
  
  # ユーザー情報取得（認証必須）
  - matches:
    - path:
        type: RegularExpression
        value: /api/users/[0-9a-f-]+
      method: GET
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-Require-Auth
          value: user
    backendRefs:
    - name: user-api-service
      port: 8081
  
  # ユーザー更新（認証必須）
  - matches:
    - path:
        type: RegularExpression
        value: /api/users/[0-9a-f-]+
      method: PUT
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-Require-Auth
          value: user
    backendRefs:
    - name: user-api-service
      port: 8081
  
  # ヘルスチェック
  - matches:
    - path:
        type: Exact
        value: /health
      method: GET
    backendRefs:
    - name: user-api-service
      port: 8081
    timeouts:
      request: 5s
      
      
