apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cart-api-route
  namespace: ec-system
  labels:
    app.kubernetes.io/name: cart-api
    app.kubernetes.io/part-of: ec-microservices
spec:
  parentRefs:
  - name: ec-apigate-way
    namespace: ec-system
    sectionName: http

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/cart
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /cart
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-Service
          value: cart-api
    backendRefs:
    - name: cart-service
      namespace: ec-backend
      port: 8085
    timeouts:
      request: 10s
