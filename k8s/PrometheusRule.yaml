apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ec-prometheusrule
  namespace: ec-monitoring
  labels:
    app.kubernetes.io/name: ec-prometheusrule
    app.kubernetes.io/part-of: ec-microservices
    app.kubernetes.io/version: "1.0.0"
spec:
  groups:
    - name: ec-availability-cart-api
      rules: 
        - alert: CartApiHighErrorRate
          expr: rate(http_requests_total(namespace="ec-backendjob="cart-api",status=~"5..")) == 1 
          for: 1m 
          labels: 
            severity: critical
            team: backend 
            namespace: ec-backend

          annotations: 
            summary: "cart-apiのエラーレートが高い"
            description: "{{ $labels.pod }}のエラーレートが{{ $value | humanizePercentage }}"

   
        - alert: CartApiStopPod
          expr: up{namespace="ec-backend"job="cart-api"} == 0
          for: 3m
          labels: 
            severity: critical
            team: backend
            namespace: ec-backend 
          annotations: 
            summary: "cart-apiのpodが停止している"
            description: "{{labels.pod}}が停止しています"
     


          



















