# Alertmanager の通知設定
#
# values-kube-prometheus-stack.yaml の
#   alertmanager.alertmanagerSpec.alertmanagerConfiguration.name: ec-alerts
# から参照される。
#
# Slack の Webhook URL は Secret 'alertmanager-slack' のキー webhook-url から読む。
# マニフェストに URL を直接書かないこと（Webhook URL は認証情報と同等で、
# 知っていれば誰でもチャンネルに投稿できる）。
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: ec-alerts
  namespace: ec-monitoring
  labels:
    app.kubernetes.io/name: ec-alerts
    app.kubernetes.io/part-of: ec-microservices
spec:
  route:
    receiver: slack-warning
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    # 未解決のまま繰り返し通知する間隔。短いと通知疲れで見なくなる。
    repeatInterval: 12h
    routes:
    - receiver: slack-critical
      matchers:
      - name: severity
        value: critical
      groupWait: 10s
      repeatInterval: 1h

  receivers:
  - name: slack-warning
    slackConfigs:
    - apiURL:
        name: alertmanager-slack
        key: webhook-url
      channel: "#alerts"
      sendResolved: true
      title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
      text: >-
        {{ range .Alerts }}{{ .Annotations.summary }}
        {{ .Annotations.description }}
        {{ end }}

  - name: slack-critical
    slackConfigs:
    - apiURL:
        name: alertmanager-slack
        key: webhook-url
      channel: "#alerts"
      sendResolved: true
      title: '[CRITICAL] {{ .CommonLabels.alertname }}'
      text: >-
        {{ range .Alerts }}{{ .Annotations.summary }}
        {{ .Annotations.description }}
        {{ end }}
