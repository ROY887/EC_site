# 【未適用】このファイルは現時点では適用しないこと。
#
# 各サービスの /metrics はまだ実装されていない（nginx にも存在しない）。
# 適用すると常時 down のターゲットが 4 つ増え、Grafana とアラートが汚れる。
#
# 有効化する条件:
#   1. product/user/cart-api に axum-prometheus 等で /metrics を実装する
#   2. フロントは nginx の stub_status + nginx-prometheus-exporter が必要
#   3. ec-backend / ec-frontend の NetworkPolicy に ec-monitoring からの
#      ingress を追加する（現在は envoy-gateway-system からのみ許可）
#
# それまでのアプリ相当の指標は、Envoy のメトリクス（podmonitor-infra.yaml）で
# 代替している。
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: 
  name: ec-backend-podmonitor
  namespace: ec-monitoring
  labels:
    app.kubernetes.io/name: ec-backend-podmonitor
    app.kubernetes.io/part-of: ec-microservices
    app.kubernetes.io/version: 1.0.0
spec:
  namespaceSelector: 
    matchNames: 
      - ec-backend

  selector:
    matchLabels:
        app.kubernetes.io/part-of: ec-microservices
    

  podMetricsEndpoints: 
    - port: http-user
      path:  /metrics
      interval: 30s
      scrapeTimeout: 20s
    - port: http-cart
      path: /metrics 
      interval: 30s 
      scrapeTimeout: 20s
    - port: http-product
      path: /metrics 
      interval: 30s
      scrapeTimeout: 20s

 

--- 
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: 
  name: ec-frontend-podmonitor
  namespace: ec-monitoring
  labels:
    app.kubernetes.io/name: ec-frontend-podmonitor
    app.kubernetes.io/version: "1.0.0" 
    app.kubernetes.io/part-of: ec-microservices
spec: 
  namespaceSelector:
    matchNames:
    - ec-frontend
  
  selector:
    matchLabels:
      app.kubernetes.io/part-of: ec-microservices
  
  podMetricsEndpoints:
  - port: http-frontend
    path: /metrics
    scheme: http 
    interval: 30s 
    scrapeTimeout: 20s
    



  







      


      

  

  

  
