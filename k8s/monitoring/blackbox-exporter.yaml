
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: ec-monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter 
    app.kubernetes.io/part-of: ec-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
        app.kubernetes.io/part-of: ec-microservices
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: blackbox-exporter
        image: quay.io/prometheus/blackbox-exporter:v0.25.0
        args:
        - --config.file=/etc/blackbox_exporter/config.yml
        - --web.listen-address=:9115
        ports:
        - name: http
          containerPort: 9115
          protocol: TCP
        resources:
          requests:
            cpu: "10m"
            memory: "24Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
        volumeMounts:
        - name: config
          mountPath: /etc/blackbox_exporter
          readOnly: true
        livenessProbe:
          httpGet:
            path: /-/healthy #このpathの理由はユーザーが定義する、healthyと被らないようにしているから
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: config
        secret:
          secretName: blackbox-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: ec-monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: ec-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
  - name: http
    port: 9115
    targetPort: http
    protocol: TCP
