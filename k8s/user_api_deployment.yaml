apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  namespace: ec-backend
  labels:
    app.kubernetes.io/name: user-api
    app.kubernetes.io/part-of: ec-microservices
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: user-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-api
        app.kubernetes.io/part-of: ec-microservices
        app.kubernetes.io/version: "1.0.0"
    spec:
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      containers:
      - name: user-api
        image: ec-site/user-api:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          protocol: TCP
          name: http-user
        env:
        - name: PORT
          value: "8081"
        - name: APP_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-url
        # cart-api と同一の鍵を共有する。未設定ならアプリが起動時に落ちる。
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: jwt-secret
        - name: RUST_LOG
          value: "info,tower_http=info"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            # bcrypt はコストの高い計算なので CPU 上限は緩めにする
            cpu: "1000m"
            memory: "256Mi"
        startupProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          periodSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ec-backend
  labels:
    app.kubernetes.io/name: user-api
    app.kubernetes.io/part-of: ec-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-api
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-api-pdb
  namespace: ec-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-api
