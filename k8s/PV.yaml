piVersion: storage.k8s.io/v1
kind: PersistentVolume
metadata:
  name: mypv
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  mountOptions:
    - hard
    - nfsvers=4.1
    - ro 
  nfs: 
    
