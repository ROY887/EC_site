apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ec-backend
data:
  init.sql: |
    -- データベース初期化スクリプト
    -- migrations は各APIコンテナの起動時に実行されます
    SELECT 'PostgreSQL initialized' as status;
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ec-backend
type: Opaque
stringData:
  postgres-password: "postgres"
  database-url: "postgres://postgres:postgres@postgres-service.ec-backend.svc.cluster.local:5432/ec_db"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ec-backend
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ec-microservices
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: ec-microservices
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: POSTGRES_DB
          value: "ec_db"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: postgres-config
        configMap:
          name: postgres-config
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests: 
          storage: 10Gi
      storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ec-backend
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ec-microservices
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app.kubernetes.io/name: postgres

    