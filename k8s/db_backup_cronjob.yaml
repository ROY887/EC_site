# PostgreSQLは定期バックアップを行う
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backup-pvc
  namespace: ec-backend
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: ec-backend
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/part-of: ec-microservices
spec:
 
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-backup
            app.kubernetes.io/part-of: ec-microservices
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          containers:
          - name: pg-dump
            image: postgres:15-alpine
            command:
            - sh
            - -c
            - |
              set -eu
              STAMP=$(date +%Y%m%d-%H%M%S)
              OUT="/backup/ec_db-${STAMP}.sql.gz"
              echo "dumping to ${OUT}"
              pg_dump "$DATABASE_URL" | gzip > "$OUT"
              echo "done: $(ls -lh "$OUT")"
              # 14 世代より古いものを削除する
              ls -1t /backup/ec_db-*.sql.gz | tail -n +15 | xargs -r rm -f
              echo "retained: $(ls -1 /backup/ec_db-*.sql.gz | wc -l) files"
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: database-url
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "500m"
                memory: "256Mi"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
            - name: backup
              mountPath: /backup
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: db-backup-pvc
          - name: tmp
            emptyDir: {}
