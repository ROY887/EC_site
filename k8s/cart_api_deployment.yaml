apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api
  namespace: ec-backend
  labels:
    app.kubernetes.io/name: cart-api
    app.kubernetes.io/part-of: ec-microservices
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart-api
        app.kubernetes.io/part-of: ec-microservices
        app.kubernetes.io/version: "v1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
    spec:
      # Pod全体の設定（ここに移動しました）
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      
      containers:
      - name: cart-api
        image: ec_site-cart-api:latest
        imagePullPolicy: IfNotPresent
        ports: 
        - containerPort: 8084
          protocol: TCP
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-url
    
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8085
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8085
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true 
          capabilities: 
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: secret
          mountPath: /etc/secret
          readOnly: true
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo 'starting' > /tmp/message"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      volumes:
      - name: tmp
        emptyDir: {}
      - name: config
        configMap:
          name: config-map
      - name: secret
        secret:
          secretName: postgres-secret 
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: cart-api
    app.kubernetes.io/part-of: ec-microservices
  name: cart-service
  namespace: ec-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cart-api
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      protocol: TCP