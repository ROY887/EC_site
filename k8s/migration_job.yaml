apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: ec-backend
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: ec-microservices
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: ec-microservices
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      #dbが起動するまで待つ
      - name: wait-for-db
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres-service.ec-backend.svc.cluster.local -p 5432 -U "$POSTGRES_USER"; do
            echo "waiting for postgres..."
            sleep 2
          done
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-user
        securityContext:
      
          runAsUser: 70
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

      - name: migrate-product
        image: ec-site/product-api:dev
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command: ["sqlx", "migrate", "run", "--ignore-missing"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-url
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

      - name: migrate-user
        image: ec-site/user-api:dev
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command: ["sqlx", "migrate", "run", "--ignore-missing"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-url
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

      - name: migrate-cart
        image: ec-site/cart-api:dev
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command: ["sqlx", "migrate", "run", "--ignore-missing"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-url
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

      containers:
      - name: done
        image: busybox:1.36
        command: ["sh", "-c", "echo 'all migrations applied'"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
