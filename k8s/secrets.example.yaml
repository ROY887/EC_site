apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ec-backend
type: Opaque
stringData:
  postgres-user: "REPLACE_ME"
  postgres-password: "REPLACE_ME"
  database-url: "postgres://REPLACE_ME:REPLACE_ME@postgres-service.ec-backend.svc.cluster.local:5432/ec_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: ec-backend
type: Opaque
stringData:
  # 32 文字未満だとアプリが起動時に停止する
  jwt-secret: "REPLACE_ME_WITH_AT_LEAST_32_CHARACTERS"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: ec-system
type: Opaque
stringData:
  token: "REPLACE_ME"

