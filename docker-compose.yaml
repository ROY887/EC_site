

services:
  postgres:
    image: postgres:15-alpine
    container_name: ec_postgres
    environment:
      POSTGRES_USER: ecuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ec_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecuser -d ec_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ec_network

  # --- マイグレーション（1 回だけ実行して終了する） ---
  migrate-product:
    build:
      context: ./product_api
    command: ["sqlx", "migrate", "run"]
    working_dir: /app
    environment:
      DATABASE_URL: &db_url postgres://ecuser:devpassword@postgres:5432/ec_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ec_network
    restart: "no"

  migrate-user:
    build:
      context: ./user_api
    command: ["sqlx", "migrate", "run"]
    working_dir: /app
    environment:
      DATABASE_URL: *db_url
    depends_on:
      migrate-product:
        condition: service_completed_successfully
    networks:
      - ec_network
    restart: "no"

  migrate-cart:
    build:
      context: ./cart_api
    command: ["sqlx", "migrate", "run"]
    working_dir: /app
    environment:
      DATABASE_URL: *db_url
    depends_on:
      migrate-user:
        condition: service_completed_successfully
    networks:
      - ec_network
    restart: "no"

  # --- アプリケーション ---
  product-api:
    build:
      context: ./product_api
    container_name: ec_product_api
    environment:
      PORT: "8084"
      DATABASE_URL: *db_url
      RUST_LOG: info,tower_http=debug
    ports:
      - "8084:8084"
    depends_on:
      migrate-cart:
        condition: service_completed_successfully
    networks:
      - ec_network
    restart: unless-stopped

  user-api:
    build:
      context: ./user_api
    container_name: ec_user_api
    environment:
      PORT: "8081"
      DATABASE_URL: *db_url
      # 開発用の固定値。cart-api と同一である必要がある（本番では Secret から注入）
      JWT_SECRET: &jwt_secret local-development-only-jwt-secret-32chars-min
      RUST_LOG: info,tower_http=debug
    ports:
      - "8081:8081"
    depends_on:
      migrate-cart:
        condition: service_completed_successfully
    networks:
      - ec_network
    restart: unless-stopped

  cart-api:
    build:
      context: ./cart_api
    container_name: ec_cart_api
    environment:
      PORT: "8085"
      DATABASE_URL: *db_url
      JWT_SECRET: *jwt_secret
      RUST_LOG: info,tower_http=debug
    ports:
      - "8085:8085"
    depends_on:
      migrate-cart:
        condition: service_completed_successfully
    networks:
      - ec_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ec_network:
    driver: bridge
