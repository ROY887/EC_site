# 非 root で動作する nginx（nginxinc/nginx-unprivileged）向けの設定。
# 静的ファイルの配信のみを担い、/api の振り分けは Gateway API 側が行う。

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 圧縮
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # セキュリティヘッダ
    # HSTS は Cloudflare 側で付与するため、ここでは設定しない
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "DENY"                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ハッシュ付きアセットは長期キャッシュ
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # k8s プローブ用
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA: 実ファイルがなければ index.html を返す
    location / {
        try_files $uri $uri/ /index.html;
    }
}
